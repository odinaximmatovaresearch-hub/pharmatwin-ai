<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>PharmaTwin AI</title>

  <meta
    name="description"
    content="AI-powered clinical decision support and longitudinal patient monitoring platform."
  />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #07111f;
      --panel: #0d1b2d;
      --panel2: #11243a;
      --border: rgba(255,255,255,.09);
      --text: #edf5ff;
      --muted: #8da2b8;
      --primary: #42d3a5;
      --primary2: #1fa984;
      --danger: #ff6575;
      --warning: #f5c451;
      --blue: #5ca9ff;
      --shadow: 0 20px 60px rgba(0,0,0,.25);
    }

    body {
      font-family: Inter, Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 0%, rgba(66,211,165,.10), transparent 30%),
        radial-gradient(circle at 90% 10%, rgba(92,169,255,.10), transparent 30%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .app {
      min-height: 100vh;
    }

    /* AUTH */

    .auth-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 30px;
    }

    .auth-card {
      width: min(480px, 100%);
      background: rgba(13,27,45,.94);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 34px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 30px;
    }

    .brand-icon {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--primary), #69b7ff);
      color: #06131d;
      font-weight: 900;
    }

    .brand h1 {
      font-size: 22px;
    }

    .brand small {
      color: var(--muted);
    }

    .auth-tabs {
      display: flex;
      gap: 8px;
      background: #091626;
      padding: 5px;
      border-radius: 12px;
      margin-bottom: 24px;
    }

    .auth-tabs button {
      flex: 1;
      border: 0;
      padding: 11px;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
    }

    .auth-tabs button.active {
      background: var(--panel2);
      color: white;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 7px;
    }

    input,
    select,
    textarea {
      width: 100%;
      background: #081525;
      color: white;
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 12px 13px;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--primary);
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .btn {
      border: 0;
      border-radius: 11px;
      padding: 12px 16px;
      font-weight: 700;
      transition: .2s;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--primary);
      color: #03140f;
    }

    .btn-secondary {
      background: var(--panel2);
      color: white;
      border: 1px solid var(--border);
    }

    .btn-danger {
      background: rgba(255,101,117,.14);
      color: #ff8793;
      border: 1px solid rgba(255,101,117,.25);
    }

    .btn-warning {
      background: rgba(245,196,81,.15);
      color: var(--warning);
      border: 1px solid rgba(245,196,81,.25);
    }

    .full {
      width: 100%;
    }

    .message {
      padding: 11px 13px;
      border-radius: 10px;
      margin-top: 14px;
      font-size: 13px;
      background: rgba(92,169,255,.1);
      color: #9ac9ff;
    }

    /* LAYOUT */

    .shell {
      min-height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 250px;
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      background: rgba(6,17,30,.92);
      border-right: 1px solid var(--border);
      padding: 24px 16px;
      z-index: 10;
    }

    .sidebar .brand {
      padding: 0 10px 24px;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .nav button {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 0;
      color: var(--muted);
      padding: 12px 13px;
      border-radius: 10px;
    }

    .nav button:hover,
    .nav button.active {
      background: var(--panel2);
      color: white;
    }

    .main {
      margin-left: 250px;
      width: calc(100% - 250px);
      min-height: 100vh;
    }

    .topbar {
      height: 76px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      background: rgba(7,17,31,.7);
      backdrop-filter: blur(15px);
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .user-chip {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg,var(--primary),var(--blue));
      display: grid;
      place-items: center;
      color: #06131d;
      font-weight: 900;
    }

    .content {
      padding: 32px;
      max-width: 1500px;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    .heading {
      margin-bottom: 25px;
    }

    .heading .eyebrow {
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--primary);
      font-weight: 800;
    }

    .heading h2 {
      font-size: 31px;
      margin-top: 6px;
    }

    .heading p {
      color: var(--muted);
      margin-top: 7px;
    }

    /* CARDS */

    .grid {
      display: grid;
      gap: 18px;
    }

    .grid-4 {
      grid-template-columns: repeat(4,1fr);
    }

    .grid-3 {
      grid-template-columns: repeat(3,1fr);
    }

    .grid-2 {
      grid-template-columns: repeat(2,1fr);
    }

    .card {
      background: rgba(13,27,45,.86);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 21px;
      box-shadow: 0 12px 35px rgba(0,0,0,.13);
    }

    .stat-label {
      color: var(--muted);
      font-size: 12px;
    }

    .stat-value {
      font-size: 30px;
      font-weight: 800;
      margin-top: 8px;
    }

    .stat-note {
      font-size: 12px;
      color: var(--primary);
      margin-top: 6px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 15px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .muted {
      color: var(--muted);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 11px;
      font-weight: 800;
    }

    .badge-green {
      color: #5ee8b8;
      background: rgba(66,211,165,.11);
    }

    .badge-red {
      color: #ff8996;
      background: rgba(255,101,117,.11);
    }

    .badge-yellow {
      color: #f6ce67;
      background: rgba(245,196,81,.11);
    }

    .badge-blue {
      color: #8dc7ff;
      background: rgba(92,169,255,.11);
    }

    /* TABLE */

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 13px 10px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    th {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* TIMELINE */

    .timeline {
      position: relative;
      margin-left: 10px;
    }

    .timeline:before {
      content: "";
      position: absolute;
      left: 9px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--border);
    }

    .timeline-item {
      position: relative;
      padding-left: 38px;
      margin-bottom: 25px;
    }

    .timeline-dot {
      position: absolute;
      left: 3px;
      top: 4px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 0 5px rgba(66,211,165,.1);
    }

    .timeline-date {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .timeline-content {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 15px;
    }

    /* MODAL */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      display: grid;
      place-items: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-card {
      width: min(650px,100%);
      max-height: 90vh;
      overflow-y: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 25px;
    }

    /* CONSENT */

    .consent-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 25px;
    }

    .consent-card {
      width: min(600px,100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 25px;
      padding: 32px;
      box-shadow: var(--shadow);
    }

    .consent-icon {
      width: 65px;
      height: 65px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      background: rgba(66,211,165,.12);
      color: var(--primary);
      font-size: 30px;
      margin-bottom: 20px;
    }

    /* MOBILE */

    @media(max-width:1000px) {
      .grid-4 {
        grid-template-columns: repeat(2,1fr);
      }

      .grid-3 {
        grid-template-columns: repeat(2,1fr);
      }
    }

    @media(max-width:700px) {
      .sidebar {
        width: 100%;
        height: auto;
        bottom: auto;
        position: relative;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      .shell {
        display: block;
      }

      .main {
        margin-left: 0;
        width: 100%;
      }

      .nav {
        display: grid;
        grid-template-columns: repeat(3,1fr);
      }

      .topbar {
        padding: 0 16px;
      }

      .content {
        padding: 18px;
      }

      .grid-4,
      .grid-3,
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div id="root"></div>

<script>
/* ============================================================
   PHARMATWIN AI FRONTEND
   ============================================================ */

/*
  Vercel frontend -> Render backend.

  CHANGE THIS URL after deploying your Render service.
*/

const API =
  window.PHARMATWIN_API ||
  "https://YOUR-RENDER-SERVICE.onrender.com";

let token =
  localStorage.getItem("pharmatwin_token");

let currentUser = null;

const $ = selector =>
  document.querySelector(selector);

const root = $("#root");

/* ============================================================
   API HELPER
   ============================================================ */

async function api(
  endpoint,
  options = {}
) {

  const headers =
    options.headers || {};

  if (
    options.body &&
    !(options.body instanceof FormData)
  ) {
    headers["Content-Type"] =
      "application/json";
  }

  if (token) {
    headers["Authorization"] =
      `Bearer ${token}`;
  }

  const response =
    await fetch(
      `${API}${endpoint}`,
      {
        ...options,
        headers
      }
    );

  let data = {};

  try {
    data = await response.json();
  } catch {}

  if (!response.ok) {
    throw new Error(
      data.message ||
      "Request failed."
    );
  }

  return data;
}

/* ============================================================
   AUTH SCREEN
   ============================================================ */

function renderAuth() {

  root.innerHTML = `
    <div class="auth-page">

      <div class="auth-card">

        <div class="brand">
          <div class="brand-icon">PT</div>

          <div>
            <h1>PharmaTwin AI</h1>
            <small>Clinical intelligence platform</small>
          </div>
        </div>

        <div class="auth-tabs">

          <button
            id="loginTab"
            class="active"
            onclick="showLogin()">
            Login
          </button>

          <button
            id="registerTab"
            onclick="showRegister()">
            Create account
          </button>

        </div>

        <div id="authForm"></div>

        <div
          id="authMessage"
          class="message hidden">
        </div>

      </div>

    </div>
  `;

  showLogin();
}

function showLogin() {

  $("#loginTab").classList.add("active");
  $("#registerTab").classList.remove("active");

  $("#authForm").innerHTML = `

    <form onsubmit="login(event)">

      <div class="field">
        <label>Email</label>
        <input
          id="loginEmail"
          type="email"
          required
          placeholder="you@example.com">
      </div>

      <div class="field">
        <label>Password</label>
        <input
          id="loginPassword"
          type="password"
          required
          placeholder="••••••••">
      </div>

      <button
        class="btn btn-primary full">
        Sign in
      </button>

    </form>
  `;
}

function showRegister() {

  $("#loginTab").classList.remove("active");
  $("#registerTab").classList.add("active");

  $("#authForm").innerHTML = `

    <form onsubmit="register(event)">

      <div class="field">
        <label>Account type</label>

        <select
          id="registerRole"
          onchange="toggleRegisterFields()">

          <option value="patient">
            Patient
          </option>

          <option value="clinician">
            Doctor / Clinician
          </option>

        </select>
      </div>

      <div class="field">
        <label>Full name</label>

        <input
          id="registerName"
          required
          placeholder="Full name">
      </div>

      <div class="field">
        <label>Email</label>

        <input
          id="registerEmail"
          type="email"
          required
          placeholder="Email">
      </div>

      <div class="field">
        <label>Phone</label>

        <input
          id="registerPhone"
          required
          placeholder="+998901234567">
      </div>

      <div
        id="patientFields">

        <div class="field">
          <label>JSHSHIR</label>

          <input
            id="registerJshshir"
            maxlength="14"
            inputmode="numeric"
            placeholder="14 digits">
        </div>

      </div>

      <div
        id="doctorFields"
        class="hidden">

        <div class="field">

          <label>
            Medical diploma — PDF only
          </label>

          <input
            id="diploma"
            type="file"
            accept="application/pdf">

        </div>

        <div class="message">
          Doctor accounts require verification
          before accessing patient data.
        </div>

      </div>

      <div class="field">
        <label>Password</label>

        <input
          id="registerPassword"
          type="password"
          minlength="8"
          required
          placeholder="At least 8 characters">
      </div>

      <button
        class="btn btn-primary full">
        Create account
      </button>

    </form>
  `;
}

function toggleRegisterFields() {

  const role =
    $("#registerRole").value;

  $("#patientFields")
    .classList.toggle(
      "hidden",
      role !== "patient"
    );

  $("#doctorFields")
    .classList.toggle(
      "hidden",
      role !== "clinician"
    );
}

function authMessage(text) {

  const box =
    $("#authMessage");

  box.textContent = text;
  box.classList.remove("hidden");
}

async function login(event) {

  event.preventDefault();

  try {

    const data =
      await api("/api/login", {
        method: "POST",

        body: JSON.stringify({
          email:
            $("#loginEmail").value,

          password:
            $("#loginPassword").value
        })
      });

    token = data.token;

    localStorage.setItem(
      "pharmatwin_token",
      token
    );

    currentUser =
      data.user;

    renderDashboard();

  } catch (error) {

    authMessage(
      error.message
    );
  }
}

async function register(event) {

  event.preventDefault();

  const role =
    $("#registerRole").value;

  const form =
    new FormData();

  form.append(
    "full_name",
    $("#registerName").value
  );

  form.append(
    "email",
    $("#registerEmail").value
  );

  form.append(
    "phone",
    $("#registerPhone").value
  );

  form.append(
    "password",
    $("#registerPassword").value
  );

  form.append(
    "role",
    role
  );

  if (role === "patient") {

    form.append(
      "jshshir",
      $("#registerJshshir").value
    );

  } else {

    const file =
      $("#diploma").files[0];

    if (!file) {

      authMessage(
        "Please upload your diploma PDF."
      );

      return;
    }

    form.append(
      "diploma",
      file
    );
  }

  try {

    const data =
      await api(
        "/api/register",
        {
          method: "POST",
          body: form
        }
      );

    authMessage(
      data.message
    );

    setTimeout(
      showLogin,
      1200
    );

  } catch(error) {

    authMessage(
      error.message
    );
  }
}

/* ============================================================
   DASHBOARD
   ============================================================ */

function renderDashboard() {

  root.innerHTML = `

    <div class="shell">

      <aside class="sidebar">

        <div class="brand">

          <div class="brand-icon">
            PT
          </div>

          <div>
            <h1>PharmaTwin</h1>
            <small>AI Clinical Platform</small>
          </div>

        </div>

        <nav class="nav">

          <button
            class="active"
            onclick="openPage('overview', this)">
            ◈ Overview
          </button>

          ${
            currentUser.role === "clinician"
              ? `
                <button
                  onclick="openPage('patients', this)">
                  ◉ Patients
                </button>

                <button
                  onclick="openPage('consent', this)">
                  ◇ Patient Access
                </button>

                <button
                  onclick="openPage('timeline', this)">
                  ◌ Timeline
                </button>
              `
              : ""
          }

          ${
            currentUser.role === "patient"
              ? `
                <button
                  onclick="openPage('health', this)">
                  ♥ My Health
                </button>

                <button
                  onclick="openPage('medications', this)">
                  ◫ Medications
                </button>

                <button
                  onclick="openPage('labs', this)">
                  ▣ Lab Results
                </button>
              `
              : ""
          }

          <button
            onclick="openPage('profile', this)">
            ◎ Profile
          </button>

          <button
            onclick="logout()">
            ↪ Sign out
          </button>

        </nav>

      </aside>

      <main class="main">

        <header class="topbar">

          <div>
            <strong id="pageTitle">
              Overview
            </strong>
          </div>

          <div class="user-chip">

            <div>
              <div>
                ${escapeHtml(
                  currentUser.full_name
                )}
              </div>

              <small class="muted">
                ${escapeHtml(
                  currentUser.role
                )}
              </small>
            </div>

            <div class="avatar">
              ${
                currentUser.full_name
                  .charAt(0)
                  .toUpperCase()
              }
            </div>

          </div>

        </header>

        <div class="content">

          <section
            id="overview"
            class="section active">
          </section>

          <section
            id="patients"
            class="section">
          </section>

          <section
            id="consent"
            class="section">
          </section>

          <section
            id="health"
            class="section">
          </section>

          <section
            id="medications"
            class="section">
          </section>

          <section
            id="labs"
            class="section">
          </section>

          <section
            id="timeline"
            class="section">
          </section>

          <section
            id="profile"
            class="section">
          </section>

        </div>

      </main>

    </div>
  `;

  loadOverview();
}

/* ============================================================
   NAVIGATION
   ============================================================ */

function openPage(id, button) {

  document
    .querySelectorAll(".section")
    .forEach(
      section =>
        section.classList.remove(
          "active"
        )
    );

  const target =
    document.getElementById(id);

  if (target) {
    target.classList.add("active");
  }

  document
    .querySelectorAll(".nav button")
    .forEach(
      b =>
        b.classList.remove(
          "active"
        )
    );

  if (button) {
    button.classList.add("active");
  }

  const titles = {
    overview: "Overview",
    patients: "Patient Registry",
    consent: "Patient Access",
    health: "My Health",
    medications: "Medications",
    labs: "Laboratory Results",
    timeline: "Treatment Timeline",
    profile: "Profile"
  };

  $("#pageTitle").textContent =
    titles[id] || "PharmaTwin";

  if (id === "overview")
    loadOverview();

  if (id === "patients")
    loadPatients();

  if (id === "consent")
    loadConsentPage();

  if (id === "health")
    loadPatientHealth();

  if (id === "medications")
    loadPatientHealth();

  if (id === "labs")
    loadPatientHealth();

  if (id === "timeline")
    loadPatientHealth();

  if (id === "profile")
    loadProfile();
}

/* ============================================================
   OVERVIEW
   ============================================================ */

async function loadOverview() {

  const section =
    $("#overview");

  if (
    currentUser.role ===
    "clinician"
  ) {

    section.innerHTML = `

      <div class="heading">

        <div class="eyebrow">
          CLINICAL INTELLIGENCE
        </div>

        <h2>Good morning, ${
          escapeHtml(
            currentUser.full_name
          )
        }</h2>

        <p>
          Monitor patients, treatments,
          laboratory changes and
          AI-generated clinical signals.
        </p>

      </div>

        </button>

      <div
        id="consentResult"
        class="message hidden">
      </div>

    </div>
  `;
}

async function sendConsent(event) {

  event.preventDefault();

  const result =
    $("#consentResult");

  try {

    const data =
      await api(
        "/api/consent-requests",
        {
          method: "POST",

          body: JSON.stringify({
            jshshir:
              $("#consentJshshir")
                .value
          })
        }
      );

    result.textContent =
      "✓ " + data.message;

    result.classList.remove(
      "hidden"
    );

  } catch(error) {

    result.textContent =
      error.message;

    result.classList.remove(
      "hidden"
    );
  }
}

async function handleConsentLink() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const consent =
    params.get("consent");

  if (!consent) {
    return false;
  }

  try {

    const data =
      await fetch(
        `${API}/api/consent/${consent}`
      );

    const request =
      await data.json();

    renderConsentPage(
      consent,
      request
    );

    return true;

  } catch {

    root.innerHTML = `
      <div class="consent-page">

        <div class="consent-card">

          <div class="consent-icon">

          <h2>

            class="muted"
            style="margin-top:10px">
            Please try again later.
          </p>

        </div>

      </div>
    `;

    return true;
  }
}

          <p
            style="margin-top:5px">

            ${escapeHtml(
              request.clinician_name
            )}

          </p>

        </div>

        <div
          id="consentActions"
          style="margin-top:20px">

          <button
            class="btn btn-primary full"
            onclick="showConsentOTP(
              '${consentToken}'
            )">

            I AGREE

          </button>

          <br><br>

          <button
            class="btn btn-danger full"
            onclick="declineConsentPublic(
              '${consentToken}'
            )">

            I DON'T AGREE

          </button>

        </div>

        <div
          id="consentPublicMessage"
          class="message hidden">
        </div>

      </div>

    </div>
  `;
}

function showConsentOTP(
  consentToken
) {

  $("#consentActions").innerHTML = `

    <div class="field">

      <label>
        Enter the 6-digit code sent by SMS
      </label>

      <input
        id="publicOTP"
        maxlength="6"
        inputmode="numeric"
        placeholder="123456">

    </div>

    <button
      class="btn btn-primary full"
      onclick="approveConsentPublic(
        '${consentToken}'
      )">

      Verify & Give Consent

    </button>

    <br><br>

    <button
      class="btn btn-secondary full"
      onclick="location.reload()">

      Back

    </button>
  `;
}

async function approveConsentPublic(
  tokenValue
) {

  const code =
    $("#publicOTP").value.trim();

  try {

    const response =
      await fetch(
        `${API}/api/consent/${tokenValue}/respond`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            decision: "agree",
            code
          })
        }
      );

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data.message
      );
    }

    showPublicMessage(
      "✓ Consent granted successfully. The clinician can now access your authorized record."
    );

  } catch(error) {

    showPublicMessage(
      error.message
    );
  }
}

async function declineConsentPublic(
  tokenValue
) {

  try {

    const response =
      await fetch(
        `${API}/api/consent/${tokenValue}/respond`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            decision: "decline"
          })
        }
      );

    const data =
      await response.json();

    showPublicMessage(
      data.message ||
      "Access request declined."
    );

  } catch(error) {

    showPublicMessage(
      error.message
    );
  }
}

function showPublicMessage(
  text
) {

  const box =
    $("#consentPublicMessage");

  box.textContent = text;
  box.classList.remove(
    "hidden"
  );
}

/* ============================================================
   SECURITY HELPERS
   ============================================================ */

function escapeHtml(value) {

  return String(
    value ?? ""
  )
  .replaceAll("&", "&amp;")
  .replaceAll("<", "&lt;")
  .replaceAll(">", "&gt;")
  .replaceAll('"', "&quot;")
  .replaceAll("'", "&#039;");
}

function escapeAttribute(value) {
  return escapeHtml(value);
}

/* ============================================================
   START
   ============================================================ */

(async function start() {

  const isConsent =
    await handleConsentLink();

  if (isConsent) {
    return;
  }

  if (!token) {

    renderAuth();

    return;
  }

  try {

    const data =
      await api("/api/me");

    currentUser =
      data.user;

    renderDashboard();

  } catch {

    logout();
  }

})();
</script>
